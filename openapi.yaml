openapi: 3.0.3
info:
  title: Adhere API
  description:
    Identity verification, credit checks, transaction monitoring, and loan fraud
    detection across Africa.
  version: "3.0.0"

servers:
  - url: https://adhere-api.smartcomply.com
    description: Production

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-access-token
      description: Your Adhere API secret key

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: failed
              data:
                type: array
                items: {}
              message:
                type: string
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: failed
              message:
                type: string
                example: Authentication credentials were not provided.

tags:
  - name: Nigeria KYC
  - name: Kenya KYC
  - name: Ghana KYC
  - name: Rwanda KYC
  - name: Uganda KYC
  - name: Document Verification
  - name: Biometrics
  - name: Individual Credit
  - name: Business Credit
  - name: Transaction Monitoring
  - name: Transaction Screening
  - name: Transaction KYC
  - name: Loan Fraud
  - name: User Journey

paths:
  # ── BIOMETRICS ──────────────────────────────────────────────

  /api/onboarding/biometrics/face/comparison:
    post:
      tags: [Biometrics]
      summary: Face Comparison
      operationId: faceComparison
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_url, selfie_url]
              properties:
                image_url:
                  type: string
                  description: URL of the reference ID photo
                selfie_url:
                  type: string
                  description: URL of the selfie image
      responses:
        "200": { description: Comparison successful }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/biometrics/face/liveliness_check/:
    post:
      tags: [Biometrics]
      summary: Face Liveness Check
      operationId: faceLiveness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  description: URL of the live selfie video to check for liveness. Supported formats .mp4, .mov, .webm, .avi, .m4v. Static images are accepted but will perform a self-comparison, not true liveness detection.
      responses:
        "200": { description: Liveness check successful }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── NIGERIA KYC ─────────────────────────────────────────────

  /api/onboarding/nigeria_kyc/bvn/:
    post:
      tags: [Nigeria KYC]
      summary: BVN Verification
      operationId: bvn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bvn]
              properties:
                bvn:
                  type: string
                  minLength: 11
                  maxLength: 11
                  description: 11-digit Bank Verification Number
                  example: "22244545518"
      responses:
        "200": { description: BVN verified successfully }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/bvn_advanced/:
    post:
      tags: [Nigeria KYC]
      summary: BVN Advanced
      operationId: bvnAdvanced
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bvn]
              properties:
                bvn:
                  type: string
                  description: 11-digit Bank Verification Number
                  example: "22244545518"
                date_of_birth:
                  type: string
                  description: Date of birth in YYYY-MM-DD format (optional, used for additional verification)
                  example: "1990-01-15"
      responses:
        "200": { description: BVN advanced data retrieved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/bvn_with_face/:
    post:
      tags: [Nigeria KYC]
      summary: BVN with Face
      operationId: bvnWithFace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bvn, image_upload]
              properties:
                bvn:
                  type: string
                  description: 11-digit Bank Verification Number
                  example: "22244545518"
                image_upload:
                  type: string
                  description: URL of the customer's photo for facial comparison
                  example: "https://example.com/photo.jpg"
      responses:
        "200": { description: BVN with face verified }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/nin/:
    post:
      tags: [Nigeria KYC]
      summary: NIN Verification
      operationId: nin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identification_number]
              properties:
                identification_number:
                  type: string
                  description: 11-digit National Identification Number
                  example: "70123456789"
      responses:
        "200": { description: NIN verified successfully }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/nin_with_face/:
    post:
      tags: [Nigeria KYC]
      summary: NIN with Face
      operationId: ninWithFace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identification_number, image_url]
              properties:
                identification_number:
                  type: string
                  description: 11-digit National Identification Number
                  example: "70123456789"
                image_url:
                  type: string
                  description: URL of the customer's photo for facial comparison
                  example: "https://example.com/photo.jpg"
      responses:
        "200": { description: NIN with face verified }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/vnin/:
    post:
      tags: [Nigeria KYC]
      summary: Virtual NIN (VNIN)
      operationId: vnin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vnin]
              properties:
                vnin:
                  type: string
                  description: 16-character Virtual NIN
                  example: "WB9D9SE8HA41Z2M0"
      responses:
        "200": { description: VNIN verified }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/voters_id/:
    post:
      tags: [Nigeria KYC]
      summary: Voter's ID
      operationId: votersId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [voters_id, first_name, last_name, date_of_birth, lga, state]
              properties:
                voters_id:
                  type: string
                  description: Permanent Voter's Card number
                  example: "91F6B1F5BE295355586"
                first_name:
                  type: string
                  description: First name as on the voter's card
                  example: "John"
                last_name:
                  type: string
                  description: Last name as on the voter's card
                  example: "Doe"
                date_of_birth:
                  type: string
                  description: Date of birth in YYYY-MM-DD format
                  example: "1994-08-11"
                lga:
                  type: string
                  description: Local government area of registration
                  example: "Lagos"
                state:
                  type: string
                  description: State of registration
                  example: "Lagos"
      responses:
        "200": { description: Voter's ID verified }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/driver_license/:
    post:
      tags: [Nigeria KYC]
      summary: Driver's License
      operationId: driverLicense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_number, first_name, last_name, date_of_birth]
              properties:
                license_number:
                  type: string
                  description: Driver's license number
                  example: "ARR10892UU00"
                first_name:
                  type: string
                  description: First name as on the license
                  example: "EDIKAN"
                last_name:
                  type: string
                  description: Last name as on the license
                  example: "EFE"
                date_of_birth:
                  type: string
                  description: Date of birth in YYYY-MM-DD format
                  example: "1994-08-11"
      responses:
        "200": { description: Driver's license verified }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/passport/:
    post:
      tags: [Nigeria KYC]
      summary: Passport Verification
      operationId: nigeriaPassport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passport_number, surname, date_of_birth]
              properties:
                passport_number:
                  type: string
                  description: The customer's passport number
                  example: "Z18679232"
                surname:
                  type: string
                  description: Surname as on the passport
                  example: "John"
                date_of_birth:
                  type: string
                  description: Date of birth in YYYY-MM-DD format
                  example: "1994-08-11"
      responses:
        "200": { description: Passport verified }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/tin/:
    post:
      tags: [Nigeria KYC]
      summary: Tax Identification Number (TIN)
      operationId: tin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tax_identification_number]
              properties:
                tax_identification_number:
                  type: string
                  description: "The company's Tax Identification Number (format: 234123456-0001, 8-14 digits)"
                  example: "234123456-0001"
      responses:
        "200": { description: TIN verified }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/nuban/:
    post:
      tags: [Nigeria KYC]
      summary: NUBAN Verification
      operationId: nuban
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_number, bank_code]
              properties:
                account_number:
                  type: string
                  description: 10-digit account number
                  example: "0123456789"
                bank_code:
                  type: string
                  example: "044"
      responses:
        "200": { description: NUBAN verified }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/nuban_advanced/:
    post:
      tags: [Nigeria KYC]
      summary: NUBAN Advanced
      operationId: nubanAdvanced
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_number, bank_code]
              properties:
                account_number:
                  type: string
                  example: "0123456789"
                bank_code:
                  type: string
                  example: "044"
      responses:
        "200": { description: NUBAN advanced data retrieved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/phone_no_basic/:
    post:
      tags: [Nigeria KYC]
      summary: Phone Number Basic
      operationId: phoneBasic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number]
              properties:
                phone_number:
                  type: string
                  example: "08012345678"
      responses:
        "200": { description: Phone basic data retrieved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/phone_no_advanced/:
    post:
      tags: [Nigeria KYC]
      summary: Phone Number Advanced
      operationId: phoneAdvanced
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number]
              properties:
                phone_number:
                  type: string
                  example: "08012345678"
      responses:
        "200": { description: Phone advanced data retrieved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/cac/:
    post:
      tags: [Nigeria KYC]
      summary: CAC Verification
      operationId: cac
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration_number, company_name, company_type]
              properties:
                registration_number:
                  type: string
                  description: The CAC registration number
                  example: "1261103"
                company_name:
                  type: string
                  description: Registered company name
                  example: "JOYCE VENTURES"
                company_type:
                  type: string
                  description: "Entity type: RC (registered company), BN (business name), or IT (incorporated trustee)"
                  example: "RC"
      responses:
        "200": { description: CAC verified }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/cac_advanced/:
    post:
      tags: [Nigeria KYC]
      summary: CAC Advanced
      operationId: cacAdvanced
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration_number, company_name, company_type]
              properties:
                registration_number:
                  type: string
                  description: The CAC registration number
                  example: "10056"
                company_name:
                  type: string
                  description: Registered company name
                  example: "JOYCE VENTURES"
                company_type:
                  type: string
                  description: "Entity type: RC (registered company), BN (business name), or IT (incorporated trustee)"
                  example: "IT"
      responses:
        "200": { description: CAC advanced data retrieved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/address_verification/:
    post:
      tags: [Nigeria KYC]
      summary: Address Verification
      operationId: addressVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [first_name, last_name, phone_number, address, lga, state]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                phone_number: { type: string }
                address: { type: string }
                lga: { type: string, description: Local Government Area }
                state: { type: string }
      responses:
        "200": { description: Address verification submitted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/digital_address_verification/:
    post:
      tags: [Nigeria KYC]
      summary: Digital Address Verification
      operationId: digitalAddressVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [first_name, last_name, phone_number, address, lga, state]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                phone_number: { type: string }
                address: { type: string }
                lga: { type: string }
                state: { type: string }
      responses:
        "200": { description: Digital address verification submitted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/digital_address_verification_confirmation/:
    post:
      tags: [Nigeria KYC]
      summary: Digital Address Confirmation
      operationId: digitalAddressConfirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity_check_id]
              properties:
                identity_check_id:
                  type: string
                  description:
                    Reference ID from the digital address verification response
      responses:
        "200": { description: Digital address result retrieved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/physical_address_verification_lagos/:
    post:
      tags: [Nigeria KYC]
      summary: Physical Address (Lagos)
      operationId: physicalAddressLagos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, phone_number, address, lga]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                phone_number: { type: string }
                address: { type: string }
                lga: { type: string, description: LGA within Lagos }
      responses:
        "200": { description: Physical address submitted (Lagos) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/physical_address_verification/:
    post:
      tags: [Nigeria KYC]
      summary: Physical Address (Other States)
      operationId: physicalAddressOther
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [first_name, last_name, phone_number, address, lga, state]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                phone_number: { type: string }
                address: { type: string }
                lga: { type: string }
                state: { type: string }
      responses:
        "200": { description: Physical address submitted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/physical_address_verification_confirmation/:
    post:
      tags: [Nigeria KYC]
      summary: Physical Address Confirmation
      operationId: physicalAddressConfirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity_check_id]
              properties:
                identity_check_id:
                  type: integer
                  description:
                    Integer ID from the physical address verification response
      responses:
        "200": { description: Physical address result retrieved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/nigeria_kyc/identity_address/:
    post:
      tags: [Nigeria KYC]
      summary: Address Lookup by NIN
      operationId: identityAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [first_name, last_name, nin, phone_number, state, time_range]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                nin: { type: string, description: 11-digit NIN }
                phone_number: { type: string }
                state: { type: string }
                time_range:
                  type: integer
                  description: Minimum months address must have been verified
      responses:
        "200": { description: Address data retrieved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── KENYA KYC ───────────────────────────────────────────────

  /api/onboarding/kenya_kyc/national_id_basic/:
    post:
      tags: [Kenya KYC]
      summary: Kenya National ID Basic
      operationId: kenyaNationalIdBasic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [national_id]
              properties:
                national_id:
                  type: string
                  description: Kenyan national ID number
                  example: "00000000"
      responses:
        "200": { description: National ID verified }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/kenya_kyc/national_id_advance/:
    post:
      tags: [Kenya KYC]
      summary: Kenya National ID Advanced
      operationId: kenyaNationalIdAdvanced
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [national_id]
              properties:
                national_id:
                  type: string
                  description: Kenyan national ID number
                  example: "1010101010"
      responses:
        "200": { description: National ID advanced data retrieved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/kenya_kyc/business_registration/:
    post:
      tags: [Kenya KYC]
      summary: Kenya Business Registration
      operationId: kenyaBusinessRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration_number]
              properties:
                registration_number:
                  type: string
                  example: "BUS/2020/123456"
                postal_code: { type: string }
                postal_address: { type: string }
      responses:
        "200": { description: Business registration verified }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/kenya_kyc/alien_id/:
    post:
      tags: [Kenya KYC]
      summary: Kenya Alien ID
      operationId: kenyaAlienId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alien_id]
              properties:
                alien_id:
                  type: string
                  description: Alien ID number for non-citizen residents
      responses:
        "200": { description: Alien ID verified }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/kenya_kyc/kra_pin/:
    post:
      tags: [Kenya KYC]
      summary: KRA PIN Verification
      operationId: kraPin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin:
                  type: string
                  description: Kenya Revenue Authority PIN
                  example: "A000000000Z"
      responses:
        "200": { description: KRA PIN verified }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/kenya_kyc/passport/:
    post:
      tags: [Kenya KYC]
      summary: Kenya Passport Verification
      operationId: kenyaPassport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passport_number]
              properties:
                passport_number: { type: string }
      responses:
        "200": { description: Passport verified }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── GHANA KYC ───────────────────────────────────────────────

  /api/onboarding/ghana_kyc/id_card/:
    post:
      tags: [Ghana KYC]
      summary: Ghana ID Card
      operationId: ghanaIdCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identification_number, id_type]
              properties:
                identification_number:
                  type: string
                  description:
                    Ghana Card, Passport, Voter ID, SSNIT, or Driver's License
                    number
                id_type:
                  type: string
                  description:
                    "GhanaCard, Passport, VoterID, SSNIT, or DriversLicense"
