  /api/v1/journey/health/:
    get:
      tags: [User Journey]
      summary: Health Check
      operationId: journeyHealth
      security: []
      responses:
        "200": { description: Service health status }

  # ── CUSTOMER ONBOARDING ─────────────────────────────────────

  /api/onboarding/verify_customer:
    post:
      tags: [Customer Onboarding]
      summary: Verify Customer
      operationId: verifyCustomer
      description:
        Combines identity verification and AML screening into a single call.
        Returns a consolidated risk decision alongside raw IVS and screening
        results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country, identifier]
              properties:
                country:
                  type: string
                  enum: [nigeria, kenya, ghana, uganda, rwanda]
                  example: "nigeria"
                  description: Country of the customer
                identifier:
                  type: string
                  example: "12345678901"
                  description:
                    The ID number to verify (BVN, NIN, National ID, etc.)
                identifier_type:
                  type: string
                  example: "bvn"
                  description:
                    "Overrides the country default. Nigeria: bvn, nin, vnin.
                    Others: national_id or ghana_id."
      responses:
        "200":
          {
            description:
              Onboarding completed — check decision field for pass/review/fail,
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description:
            Feature not enabled for this branch or account not verified

  /api/onboarding/settings:
    get:
      tags: [Customer Onboarding]
      summary: Get Onboarding Settings
      operationId: getOnboardingSettings
      description:
        Retrieve the current IVS and AML toggle settings for your branch.
      responses:
        "200": { description: Settings retrieved }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Customer Onboarding]
      summary: Update Onboarding Settings
      operationId: updateOnboardingSettings
      description:
        Enable or disable identity verification (IVS) and AML screening for your
        branch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ivs:
                  type: boolean
                  description: Enable or disable identity verification
                aml:
                  type: boolean
                  description: Enable or disable AML screening
      responses:
        "200": { description: Settings saved }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── DOCUMENT VERIFICATION ───────────────────────────────────

  /api/onboarding/document_verification:
    post:
      tags: [Document Verification]
      summary: Document Verification
      operationId: documentVerification
      description: >
        Extract identity details from a photo of a document using OCR,
        plus a required face match against a selfie (still-image
        comparison only — no liveness, no video, no blink/motion
        challenge) for every document_type except cac_certificate and
        utility_bill. Fallback for the number-lookup checks (Passport,
        Driver's License, NIN with Face, VNIN, Voter's ID) while those
        are unavailable. Which document_type values are valid depends
        on country — see the Supported Documents table on this page.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document_type, country, document_front]
              properties:
                document_type:
                  type: string
                  enum:
                    [
                      national_id,
                      passport,
                      drivers_license,
                      voters_card,
                      kenya_id,
                      cac_certificate,
                      utility_bill,
                    ]
                  description: >
                    The kind of document being submitted. Which values are
                    valid depends on country — passport works for every
                    supported country; the rest are country-specific.
                  example: "passport"
                country:
                  type: string
                  enum: [nigeria, kenya, ghana, canada, usa, "cote d'ivoire"]
                  description: Country the document was issued in.
                  example: "nigeria"
                document_front:
                  type: string
                  format: binary
                  description: Front of the document. JPG or PNG, max 5MB.
                document_back:
                  type: string
                  format: binary
                  description: >
                    Back of the document. Optional for every type, but
                    recommended for two-sided documents (national_id,
                    kenya_id, drivers_license) — extraction may be less
                    complete without it.
                selfie_image:
                  type: string
                  format: binary
                  description: >
                    A selfie to compare against the face extracted from the
                    document. JPG or PNG, max 5MB. Required for every
                    document_type except cac_certificate and utility_bill,
                    which never carry a face photo and reject the request
                    with 400 if selfie_image is missing for any other type.
                    Still-image comparison only, not liveness.
      responses:
        "200":
          description: Document details extracted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      valid: { type: boolean }
                      first_name: { type: string }
                      last_name: { type: string }
                      full_name: { type: string }
                      date_of_birth: { type: string }
                      gender: { type: string }
                      nationality: { type: string }
                      address: { type: string }
                      id_number: { type: string }
                      serial_number: { type: string }
                      id_type: { type: string }
                      document_type: { type: string }
                      expiry_date: { type: string }
                      issue_date: { type: string }
                      is_expired: { type: boolean }
                      photo:
                        type: string
                        description: Base64-encoded face photo extracted from the document. Absent for document types with no face photo (cac_certificate, utility_bill).
                      extra_fields:
                        type: object
                        description: Every other field OCR read from the document that doesn't have its own dedicated field above. Varies by document_type and country.
                      face_match:
                        type: object
                        description: Present only when selfie_image was supplied.
                        properties:
                          attempted: { type: boolean }
                          verified:
                            type: boolean
                            nullable: true
                            description: "true/false if the comparison ran; null if it couldn't (see reason)."
                          confidence_percentage: { type: number }
                          selfie_image:
                            type: string
                            description: URL of the uploaded selfie.
                          reason:
                            type: string
                            description: Present when verified is null — explains why the comparison couldn't run or complete.
                  message:
                    type: string
                    example: "Document details retrieved successfully"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
