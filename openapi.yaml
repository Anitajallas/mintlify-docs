  /api/v1/monitoring/limit:
    get:
      tags: [Transaction Monitoring]
      summary: Get Transaction Limit
      operationId: getLimit
      responses:
        "200":
          description: Limit retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  limit: { type: number, example: 200000 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Transaction Monitoring]
      summary: Set Transaction Limit
      operationId: setLimit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limit]
              properties:
                limit: { type: number, example: 100000 }
      responses:
        "200": { description: Limit updated }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/monitoring/threshold:
    get:
      tags: [Transaction Monitoring]
      summary: Get Fraud Alert Threshold
      operationId: getThreshold
      responses:
        "200":
          description: Threshold retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  threshhold: { type: number, example: 7 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Transaction Monitoring]
      summary: Set Fraud Alert Threshold
      operationId: setThreshold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [threshhold]
              properties:
                threshhold:
                  type: number
                  description: "Note: double-h spelling is required by the API"
                  example: 70
      responses:
        "200": { description: Threshold updated }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/monitoring/transaction_monitoring/:
    post:
      tags: [Transaction Monitoring]
      summary: Submit Transaction for Monitoring
      operationId: submitTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  transaction_id,
                  amount,
                  currency,
                  transaction_type,
                  account_type,
                  customer_details,
                  additional_info,
                ]
              properties:
                transaction_id:
                  type: string
                  example: "TXN-12345678"
                amount:
                  type: number
                  example: 50000
                currency:
                  type: string
                  example: "NGN"
                transaction_type:
                  type: string
                  enum: [transfer, ussd, web, card]
                  description: "Discriminator for the payload shape. transfer/ussd/web require origin_account and destination_account. card requires card_details."
                account_type:
                  type: string
                  enum: [individual, corporate]
                origin_account:
                  type: object
                  description: "Required when transaction_type is transfer, ussd, or web"
                  required: [account_number, bank_code]
                  properties:
                    account_number: { type: string, example: "9876543219" }
                    bank_code: { type: string, example: "001" }
                destination_account:
                  type: object
                  description: "Required when transaction_type is transfer, ussd, or web"
                  required: [account_number, bank_code]
                  properties:
                    account_number: { type: string, example: "123456789" }
                    bank_code: { type: string, example: "002" }
                card_details:
                  type: object
                  description: "Required when transaction_type is card"
                  required: [bin, last4]
                  properties:
                    bin:
                      type: integer
                      description: First six digits of the card (BIN)
                      example: 345676
                    last4:
                      type: integer
                      description: Last four digits of the card
                      example: 9809
                merchant_details:
                  type: object
                  description: "Optional but recommended when transaction_type is card"
                  properties:
                    merchant_name:
                      type: string
                      example: "ABC Stores"
                    merchant_location:
                      type: string
                      example: "Lagos, Nigeria"
                    merchant_code:
                      type: string
                      description: Merchant category code (MCC)
                      example: "5813"
                timestamp:
                  type: string
                  format: date-time
                  description: ISO 8601 transaction timestamp (used with card transactions)
                  example: "2025-08-23T14:30:00Z"
                customer_details:
                  type: object
                  required: [customer_name, customer_email]
                  properties:
                    customer_name: { type: string }
                    customer_email: { type: string, format: email }
                    customer_phone:
                      type: string
                      example: "+2347012345678"
                    identifier:
                      type: string
                      description: "Customer identifier value. Use bvn for Nigeria, national_id for Kenya, ghana_card for Ghana, etc."
                      example: "22430372151"
                    identifier_type:
                      type: string
                      description: "Key of the identifier type (e.g. bvn, national_id, ghana_card). Required when identifier is provided"
                      example: "bvn"
                additional_info:
                  type: object
                  required: [ip_address, location]
                  properties:
                    ip_address: { type: string, example: "192.168.1.1" }
                    location: { type: string, example: "Lagos, Nigeria" }
                    transaction_description: { type: string }
                run_kyc:
                  type: boolean
                  default: false
      responses:
        "201": { description: Transaction processed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── TRANSACTION SCREENING ────────────────────────────────────

  /api/v1/monitoring/transaction_screening/:
    post:
      tags: [Transaction Screening]
      summary: Screen a Transaction
      operationId: screenTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, transactionDate, sender, receiver]
              properties:
                transactionId: { type: string }
                transactionType: { type: string, example: "Transfer" }
                amount: { type: number, example: 10000.00 }
                currency: { type: string, example: "NGN" }
                transactionDate:
                  type: string
                  format: date-time
                  example: "2024-07-06T12:34:56Z"
                sender:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
                    accountNumber: { type: string }
                    address:
                      type: object
                      properties:
                        street: { type: string }
                        city: { type: string }
                        state: { type: string }
                        postalCode: { type: string }
                        country: { type: string }
                    identification:
                      type: object
                      properties:
                        type: { type: string }
                        number: { type: string }
                        country: { type: string }
                receiver:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
                    accountNumber: { type: string }
                    address:
                      type: object
                      properties:
                        street: { type: string }
                        city: { type: string }
                        state: { type: string }
                        postalCode: { type: string }
                        country: { type: string }
                details:
                  type: object
                  properties:
                    purpose: { type: string }
                    reference: { type: string }
      responses:
        "201": { description: Transaction screened }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

